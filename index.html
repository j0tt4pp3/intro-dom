<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Explorando DOM</title>
  </head>

  <body>
    <header>
      <nav>
        <a class="logo" href=""> Logo</a>
        <button
          type="button"
          id="menu-toggle"
          aria-label="Abrir menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M21 5.5H3V7h18V5.5Zm0 5.75H3v1.5h18v-1.5ZM3 17h18v1.5H3V17Z"
              fill="currentColor"
            />
          </svg>
        </button>
        <ul id="menu" class="menu">
          <li><a href="">Início</a></li>
          <li><a href="">Sobre</a></li>
          <li><a href="">Serviços</a></li>
          <li><a href="">Contato</a></li>
        </ul>
      </nav>
    </header>

    <!-- modal -->
    <dialog id="modal-inscricao" class="modal">
      <button type="button" class="modal-fechar" aria-label="Fechar modal">
        <svg
          width="24"
          height="24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="m20.28 4.78-1.06-1.06L12 10.94 4.78 3.72 3.72 4.78 10.94 12l-7.22 7.22 1.06 1.06L12 13.06l7.22 7.22 1.06-1.06L13.06 12l7.22-7.22Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <div class="modal-conteudo">
        <span class="modal-tag">NEWSLETTER</span>

        <h2>Fique por dentro!</h2>
        <p>
          Inscreva-se para receber novidades, conteúdos e dicas diretamente no
          seu email.
        </p>

        <form id="form-inscricao" class="form-inscricao">
          <div>
            <label for="nome">Seu nome:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex: Ana"
              required
            />
          </div>

          <div>
            <label for="email">Seu email:</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Ex: email@email.com"
              required
            />
          </div>

          <button type="submit" class="modal-submit">Quero me inscrever</button>
        </form>

        <span class="modal-rodape"> Sem spam. Cancele quando quiser!</span>
      </div>
    </dialog>

    <script src="js/menu-hamburguer.js"></script>
    <script src="js/modal.js"></script>
  </body>
</html>
